id = "goober/wall-in-one"
name = "Wall-in-One"
version = "0.5.0"
plugin_api = 17
author = "goober"
license = "MIT"
icon = "library-photo"
description = "Build reusable wallpaper pairings and playlists with live media, schedules, and exact Noctalia palette previews."
deprecated = false
tags = ["wallpaper", "bar", "panel", "shortcut", "theming", "video", "service", "utility"]
dependencies = ["bash", "curl", "sha256sum"]

[[setting]]
key = "use_wallhaven"
type = "bool"
label_key = "settings.use_wallhaven.label"
description_key = "settings.use_wallhaven.description"
default = true

[[setting]]
key = "wallhaven_api_key"
type = "string"
label_key = "settings.wallhaven_api_key.label"
description_key = "settings.wallhaven_api_key.description"
default = ""
visible_when = { key = "use_wallhaven", values = ["true"] }
advanced = true

[[setting]]
key = "use_w_engine"
type = "bool"
label_key = "settings.use_w_engine.label"
description_key = "settings.use_w_engine.description"
default = true

[[setting]]
key = "use_mpvpaper"
type = "bool"
label_key = "settings.use_mpvpaper.label"
description_key = "settings.use_mpvpaper.description"
default = true

[[setting]]
key = "use_motionbgs"
type = "bool"
label_key = "settings.use_motionbgs.label"
description_key = "settings.use_motionbgs.description"
default = true

[[setting]]
key = "w_engine_backend"
type = "select"
label_key = "settings.w_engine_backend.label"
description_key = "settings.w_engine_backend.description"
default = "auto"
visible_when = { key = "use_w_engine", values = ["true"] }
options = [
  { value = "auto", label_key = "settings.backends.options.auto" },
  { value = "external", label_key = "settings.backends.options.external" },
  { value = "internal", label_key = "settings.backends.options.internal" },
]

[[setting]]
key = "mpvpaper_backend"
type = "select"
label_key = "settings.mpvpaper_backend.label"
description_key = "settings.mpvpaper_backend.description"
default = "auto"
visible_when = { key = "use_mpvpaper", values = ["true"] }
options = [
  { value = "auto", label_key = "settings.backends.options.auto" },
  { value = "external", label_key = "settings.backends.options.external" },
  { value = "internal", label_key = "settings.backends.options.internal" },
]

[[setting]]
key = "internal_renderer_layer"
type = "select"
label_key = "settings.internal_renderer_layer.label"
description_key = "settings.internal_renderer_layer.description"
default = "bottom"
options = [
  { value = "bottom", label_key = "settings.internal_renderer_layer.options.bottom" },
  { value = "background", label_key = "settings.internal_renderer_layer.options.background" },
]
advanced = true

[[setting]]
key = "use_extra_provider"
type = "bool"
label_key = "settings.use_extra_provider.label"
description_key = "settings.use_extra_provider.description"
default = true
advanced = true

[[setting]]
key = "capture_directory"
type = "folder"
label_key = "settings.capture_directory.label"
description_key = "settings.capture_directory.description"
default = ""

[[setting]]
key = "video_directory"
type = "folder"
label_key = "settings.video_directory.label"
description_key = "settings.video_directory.description"
default = ""

[[setting]]
key = "motionbgs_download_directory"
type = "folder"
label_key = "settings.motionbgs_download_directory.label"
description_key = "settings.motionbgs_download_directory.description"
default = ""
visible_when = { key = "use_motionbgs", values = ["true"] }

[[setting]]
key = "motionbgs_quality"
type = "select"
label_key = "settings.motionbgs_quality.label"
description_key = "settings.motionbgs_quality.description"
default = "hd"
visible_when = { key = "use_motionbgs", values = ["true"] }
options = [
  { value = "hd", label_key = "settings.motionbgs_quality.options.hd" },
  { value = "4k", label_key = "settings.motionbgs_quality.options.4k" },
]

[[setting]]
key = "motionbgs_result_limit"
type = "int"
label_key = "settings.motionbgs_result_limit.label"
description_key = "settings.motionbgs_result_limit.description"
default = 24
min = 1
max = 24
visible_when = { key = "use_motionbgs", values = ["true"] }
advanced = true

[[setting]]
key = "motionbgs_cache_minutes"
type = "int"
label_key = "settings.motionbgs_cache_minutes.label"
description_key = "settings.motionbgs_cache_minutes.description"
default = 30
min = 5
max = 1440
visible_when = { key = "use_motionbgs", values = ["true"] }
advanced = true

[[setting]]
key = "motionbgs_max_download_mb"
type = "int"
label_key = "settings.motionbgs_max_download_mb.label"
description_key = "settings.motionbgs_max_download_mb.description"
default = 256
min = 16
max = 512
visible_when = { key = "use_motionbgs", values = ["true"] }
advanced = true

[[setting]]
key = "auto_capture"
type = "bool"
label_key = "settings.auto_capture.label"
description_key = "settings.auto_capture.description"
default = true

[[setting]]
key = "sync_colors"
type = "bool"
label_key = "settings.sync_colors.label"
description_key = "settings.sync_colors.description"
default = false

[[setting]]
key = "color_scheme"
type = "select"
label_key = "settings.color_scheme.label"
description_key = "settings.color_scheme.description"
default = "m3-content"
visible_when = { key = "sync_colors", values = ["true"] }
options = [
  { value = "m3-content", label_key = "settings.color_scheme.options.m3_content" },
  { value = "m3-tonal-spot", label_key = "settings.color_scheme.options.m3_tonal_spot" },
  { value = "m3-fruit-salad", label_key = "settings.color_scheme.options.m3_fruit_salad" },
  { value = "m3-rainbow", label_key = "settings.color_scheme.options.m3_rainbow" },
  { value = "m3-monochrome", label_key = "settings.color_scheme.options.m3_monochrome" },
  { value = "vibrant", label_key = "settings.color_scheme.options.vibrant" },
  { value = "faithful", label_key = "settings.color_scheme.options.faithful" },
  { value = "soft", label_key = "settings.color_scheme.options.soft" },
  { value = "dysfunctional", label_key = "settings.color_scheme.options.dysfunctional" },
  { value = "muted", label_key = "settings.color_scheme.options.muted" },
]

[[setting]]
key = "palette_output"
type = "string"
label_key = "settings.palette_output.label"
description_key = "settings.palette_output.description"
default = ""
advanced = true

[[setting]]
key = "video_source"
type = "file"
label_key = "settings.video_source.label"
description_key = "settings.video_source.description"
default = ""
extensions = [".mp4", ".mkv", ".webm", ".mov", ".avi", ".m4v", ".gif"]

[[setting]]
key = "manual_pair_file"
type = "file"
label_key = "settings.manual_pair_file.label"
description_key = "settings.manual_pair_file.description"
default = ""
extensions = [".png", ".jpg", ".jpeg", ".webp", ".avif", ".gif"]

[[setting]]
key = "video_frame_second"
type = "int"
label_key = "settings.video_frame_second.label"
description_key = "settings.video_frame_second.description"
default = 1
min = 0
max = 3600
advanced = true

[[setting]]
key = "workshop_id"
type = "string"
label_key = "settings.workshop_id.label"
description_key = "settings.workshop_id.description"
default = ""

[[setting]]
key = "workshop_directory"
type = "folder"
label_key = "settings.workshop_directory.label"
description_key = "settings.workshop_directory.description"
default = ""
advanced = true

[[setting]]
key = "scene_screenshot_delay"
type = "int"
label_key = "settings.scene_screenshot_delay.label"
description_key = "settings.scene_screenshot_delay.description"
default = 15
min = 1
max = 120
visible_when = { key = "use_w_engine", values = ["true"] }
advanced = true

[[setting]]
key = "w_engine_scaling"
type = "select"
label_key = "settings.w_engine_scaling.label"
description_key = "settings.w_engine_scaling.description"
default = "fill"
visible_when = { key = "use_w_engine", values = ["true"] }
options = [
  { value = "default", label_key = "settings.w_engine_scaling.options.default" },
  { value = "stretch", label_key = "settings.w_engine_scaling.options.stretch" },
  { value = "fit", label_key = "settings.w_engine_scaling.options.fit" },
  { value = "fill", label_key = "settings.w_engine_scaling.options.fill" },
]

[[setting]]
key = "w_engine_clamp"
type = "select"
label_key = "settings.w_engine_clamp.label"
description_key = "settings.w_engine_clamp.description"
default = "border"
visible_when = { key = "use_w_engine", values = ["true"] }
options = [
  { value = "clamp", label_key = "settings.w_engine_clamp.options.clamp" },
  { value = "border", label_key = "settings.w_engine_clamp.options.border" },
  { value = "repeat", label_key = "settings.w_engine_clamp.options.repeat" },
]

[[setting]]
key = "w_engine_fps"
type = "int"
label_key = "settings.w_engine_fps.label"
description_key = "settings.w_engine_fps.description"
default = 30
min = 5
max = 144
advanced = true

[[setting]]
key = "w_engine_volume"
type = "int"
label_key = "settings.w_engine_volume.label"
description_key = "settings.w_engine_volume.description"
default = 0
min = 0
max = 100
advanced = true

[[setting]]
key = "w_engine_silent"
type = "bool"
label_key = "settings.w_engine_silent.label"
description_key = "settings.w_engine_silent.description"
default = true
advanced = true

[[setting]]
key = "w_engine_noautomute"
type = "bool"
label_key = "settings.w_engine_noautomute.label"
description_key = "settings.w_engine_noautomute.description"
default = false
advanced = true

[[setting]]
key = "w_engine_no_audio_processing"
type = "bool"
label_key = "settings.w_engine_no_audio_processing.label"
description_key = "settings.w_engine_no_audio_processing.description"
default = false
advanced = true

[[setting]]
key = "w_engine_disable_particles"
type = "bool"
label_key = "settings.w_engine_disable_particles.label"
description_key = "settings.w_engine_disable_particles.description"
default = false
advanced = true

[[setting]]
key = "w_engine_disable_mouse"
type = "bool"
label_key = "settings.w_engine_disable_mouse.label"
description_key = "settings.w_engine_disable_mouse.description"
default = false
advanced = true

[[setting]]
key = "w_engine_disable_parallax"
type = "bool"
label_key = "settings.w_engine_disable_parallax.label"
description_key = "settings.w_engine_disable_parallax.description"
default = false
advanced = true

[[setting]]
key = "w_engine_no_fullscreen_pause"
type = "bool"
label_key = "settings.w_engine_no_fullscreen_pause.label"
description_key = "settings.w_engine_no_fullscreen_pause.description"
default = false
advanced = true

[[setting]]
key = "w_engine_fullscreen_pause_only_active"
type = "bool"
label_key = "settings.w_engine_fullscreen_pause_only_active.label"
description_key = "settings.w_engine_fullscreen_pause_only_active.description"
default = false
advanced = true

[[setting]]
key = "mpv_mute"
type = "bool"
label_key = "settings.mpv_mute.label"
description_key = "settings.mpv_mute.description"
default = true
advanced = true

[[setting]]
key = "mpv_hardware_decode"
type = "bool"
label_key = "settings.mpv_hardware_decode.label"
description_key = "settings.mpv_hardware_decode.description"
default = true
advanced = true

[[setting]]
key = "mpv_auto_pause"
type = "bool"
label_key = "settings.mpv_auto_pause.label"
description_key = "settings.mpv_auto_pause.description"
default = true
advanced = true

[[setting]]
key = "mpv_auto_pause_mode"
type = "select"
label_key = "settings.mpv_auto_pause_mode.label"
description_key = "settings.mpv_auto_pause_mode.description"
default = "FULL"
visible_when = { key = "mpv_auto_pause", values = ["true"] }
options = [
  { value = "FULL", label_key = "settings.mpv_auto_pause_mode.options.full" },
  { value = "MAX", label_key = "settings.mpv_auto_pause_mode.options.max" },
  { value = "ACTIVE", label_key = "settings.mpv_auto_pause_mode.options.active" },
]
advanced = true

[[setting]]
key = "mpv_options"
type = "string"
label_key = "settings.mpv_options.label"
description_key = "settings.mpv_options.description"
default = ""
advanced = true

[[setting]]
key = "cycle_interval_minutes"
type = "int"
label_key = "settings.cycle_interval_minutes.label"
description_key = "settings.cycle_interval_minutes.description"
default = 15
min = 1
max = 43200

[[setting]]
key = "cycle_order"
type = "select"
label_key = "settings.cycle_order.label"
description_key = "settings.cycle_order.description"
default = "sequential"
options = [
  { value = "sequential", label_key = "settings.cycle_order.options.sequential" },
  { value = "shuffle", label_key = "settings.cycle_order.options.shuffle" },
]

[[setting]]
key = "cycle_start_on_load"
type = "bool"
label_key = "settings.cycle_start_on_load.label"
description_key = "settings.cycle_start_on_load.description"
default = false

[[setting]]
key = "extra_provider_panel"
type = "string"
label_key = "settings.extra_provider_panel.label"
description_key = "settings.extra_provider_panel.description"
default = ""
advanced = true

[[service]]
id = "coordinator"
entry = "service.luau"

[[service]]
id = "renderer"
entry = "renderer.luau"

[[service]]
id = "motionbgs"
entry = "motionbgs.luau"

[[service]]
id = "palettes"
entry = "palettes.luau"

[[service]]
id = "wallhaven"
entry = "wallhaven.luau"

[[widget]]
id = "wall-in-one"
entry = "widget.luau"

  # Wall-in-One owns all three buttons through its persisted gesture map.
  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "library-photo"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "Wall-in-One"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true

  [[widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.color.label"
  description_key = "settings.color.description"
  default = "on_surface"

[[panel]]
id = "hub"
entry = "panel.luau"
width = 820
height = 780
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true

[[shortcut]]
id = "wall-in-one-shortcut"
entry = "shortcut.luau"
