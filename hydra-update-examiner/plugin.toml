id = "goober/hydra-update-examiner"
name = "Hydra Update Examiner"
version = "0.2.0"
plugin_api = 15
author = "goober"
license = "MIT"
icon = "server-bolt"
description = "Shows NixOS and Nixpkgs channel readiness from Hydra gate status."
deprecated = false
tags = ["bar", "indicator", "nixos", "system"]
dependencies = ["bash", "curl", "jq", "perl", "grep", "awk", "sed", "head", "tr", "cut", "date", "cat", "timeout", "xdg-open"]

# Data-source settings are plugin-wide because the singleton service owns one
# poll stream shared by every bar placement.
[[setting]]
key = "channel_preset"
type = "select"
label_key = "settings.channel.label"
description_key = "settings.channel.description"
default = "nixos-unstable"
options = [
  { value = "nixos-unstable", label_key = "channels.nixos_unstable" },
  { value = "nixos-unstable-small", label_key = "channels.nixos_unstable_small" },
  { value = "nixos-stable", label_key = "channels.nixos_stable" },
  { value = "nixos-stable-small", label_key = "channels.nixos_stable_small" },
  { value = "nixpkgs-unstable", label_key = "channels.nixpkgs_unstable" },
  { value = "custom", label_key = "channels.custom" },
]

[[setting]]
key = "custom_channel"
type = "string"
label_key = "settings.custom_channel.label"
description_key = "settings.custom_channel.description"
default = ""
visible_when = { key = "channel_preset", values = ["custom"] }

[[setting]]
key = "refresh_interval_minutes"
type = "int"
label_key = "settings.refresh.label"
description_key = "settings.refresh.description"
default = 60
min = 1
max = 1440
step = 1

[[setting]]
key = "close_threshold"
type = "int"
label_key = "settings.close_threshold.label"
description_key = "settings.close_threshold.description"
default = 90
min = 1
max = 100
step = 1

# V4 exposed appearance as plugin-wide settings. Keep that one-page workflow as
# the v5 default while still allowing an individual bar placement to opt out.
[[setting]]
key = "shared_display_mode"
type = "select"
label_key = "settings.shared_display_mode.label"
description_key = "settings.shared_display_mode.description"
default = "always"
options = [
  { value = "on_hover", label_key = "display_mode.on_hover" },
  { value = "always", label_key = "display_mode.always" },
  { value = "icon_only", label_key = "display_mode.icon_only" },
]

[[setting]]
key = "shared_running_color"
type = "color"
label_key = "settings.shared_colors.running"
default = "secondary"

[[setting]]
key = "shared_stalled_color"
type = "color"
label_key = "settings.shared_colors.stalled"
description_key = "settings.colors.stalled_description"
default = "error"

[[setting]]
key = "shared_close_color"
type = "color"
label_key = "settings.shared_colors.close"
description_key = "settings.colors.close_description"
default = "tertiary"

[[setting]]
key = "shared_launched_color"
type = "color"
label_key = "settings.shared_colors.launched"
description_key = "settings.colors.launched_description"
default = "primary"

[[setting]]
key = "shared_running_glyph"
type = "glyph"
label_key = "settings.shared_glyphs.running"
default = "server-bolt"

[[setting]]
key = "shared_stalled_glyph"
type = "glyph"
label_key = "settings.shared_glyphs.stalled"
default = "server-off"

[[setting]]
key = "shared_close_glyph"
type = "glyph"
label_key = "settings.shared_glyphs.close"
default = "server-spark"

[[setting]]
key = "shared_launched_glyph"
type = "glyph"
label_key = "settings.shared_glyphs.launched"
default = "rocket"

[[service]]
id = "status"
entry = "service.luau"

[[widget]]
id = "hydra"
entry = "widget.luau"

  # API 14+ action defaults are visible and overridable in the widget editor.
  # Middle click keeps Noctalia's built-in settings-open-widget default.
  [widget.actions]
  right = "panel-toggle goober/hydra-update-examiner:actions"

  [[widget.setting]]
  key = "use_shared_presentation"
  type = "bool"
  label_key = "settings.use_shared_presentation.label"
  description_key = "settings.use_shared_presentation.description"
  default = true

  # These non-advanced controls preserve v5's per-placement customization when
  # the shared-presentation toggle is disabled.
  [[widget.setting]]
  key = "display_mode"
  type = "select"
  label_key = "settings.overrides.display_mode.label"
  description_key = "settings.overrides.display_mode.description"
  default = "always"
  visible_when = { key = "use_shared_presentation", values = ["false"] }
  options = [
    { value = "on_hover", label_key = "display_mode.on_hover" },
    { value = "always", label_key = "display_mode.always" },
    { value = "icon_only", label_key = "display_mode.icon_only" },
  ]

  [[widget.setting]]
  key = "running_color"
  type = "color"
  label_key = "settings.overrides.colors.running"
  default = "secondary"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "stalled_color"
  type = "color"
  label_key = "settings.overrides.colors.stalled"
  description_key = "settings.colors.stalled_description"
  default = "error"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "close_color"
  type = "color"
  label_key = "settings.overrides.colors.close"
  description_key = "settings.colors.close_description"
  default = "tertiary"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "launched_color"
  type = "color"
  label_key = "settings.overrides.colors.launched"
  description_key = "settings.colors.launched_description"
  default = "primary"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "running_glyph"
  type = "glyph"
  label_key = "settings.overrides.glyphs.running"
  default = "server-bolt"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "stalled_glyph"
  type = "glyph"
  label_key = "settings.overrides.glyphs.stalled"
  default = "server-off"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "close_glyph"
  type = "glyph"
  label_key = "settings.overrides.glyphs.close"
  default = "server-spark"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

  [[widget.setting]]
  key = "launched_glyph"
  type = "glyph"
  label_key = "settings.overrides.glyphs.launched"
  default = "rocket"
  visible_when = { key = "use_shared_presentation", values = ["false"] }

[[panel]]
id = "actions"
entry = "panel.luau"
width = 300
height = 300
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
