name: Validate Noctalia v5 source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The Hydra request-budget suite compares against the pre-refactor
          # helper read from an earlier revision, so the default shallow
          # checkout is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate source
        run: |
          python3 tools/validate.py --require-shellcheck
          python3 nocvox/tests/check.py
          python3 hydra-update-examiner/tests/test_request_budget.py
          python3 wall-in-one/tests/test_contract.py
