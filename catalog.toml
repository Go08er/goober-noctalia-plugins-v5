# Standalone Noctalia v5 Git source; not part of the built-in catalogs.

[[plugin]]
id = "goober/hydra-update-examiner"
name = "Hydra Update Examiner"
version = "0.4.0"
author = "goober"
license = "MIT"
icon = "server-bolt"
description = "Shows NixOS and Nixpkgs channel readiness from Hydra gate status."
deprecated = false
plugin_api = 15
tags = ["bar", "indicator", "nixos", "system"]
dependencies = ["bash", "curl", "jq", "perl", "grep", "awk", "sed", "head", "tr", "cut", "date", "cat", "timeout", "xdg-open"]

[[plugin]]
id = "goober/nocvox"
name = "NocVox"
version = "0.3.0"
author = "goober"
license = "MIT"
icon = "microphone"
description = "A live status and recording-control companion for an existing VoxType daemon."
deprecated = false
plugin_api = 17
tags = ["audio", "bar", "indicator", "privacy", "productivity", "recording", "service", "utility"]
dependencies = ["voxtype"]

[[plugin]]
id = "goober/wall-in-one"
name = "Wall-in-One"
version = "0.4.0"
author = "goober"
