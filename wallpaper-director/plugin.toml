id = "goober/wallpaper-director"
name = "Wallpaper Director"
version = "0.1.0"
plugin_api = 17
author = "goober"
license = "MIT"
icon = "library-photo"
description = "Routes Noctalia, Wallhaven, and W Engine wallpaper controls through one configurable hub."
deprecated = false
tags = ["wallpaper", "bar", "panel", "shortcut", "theming", "utility"]
dependencies = []

[[service]]
id = "hub"
entry = "service.luau"

[[widget]]
id = "wallpapers"
entry = "widget.luau"

  # Noctalia normally reserves middle click for widget settings. The Director
  # owns all three buttons so its plugin-data gesture map remains authoritative.
  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "library-photo"

  [[widget.setting]]
  key = "label"
  type = "string"
  label_key = "settings.label.label"
  description_key = "settings.label.description"
  default = "Wallpapers"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true

  [[widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.color.label"
  description_key = "settings.color.description"
  default = "on_surface"

[[panel]]
id = "director"
entry = "panel.luau"
width = 560
height = 660
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true

[[shortcut]]
id = "wallpapers-shortcut"
entry = "shortcut.luau"
